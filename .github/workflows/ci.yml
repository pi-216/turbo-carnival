name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Audit gems for known security defects
        run: bundle exec bundler-audit check --update

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The single lint entry point (PRD 0006 R8 / ticket #91): rubocop house
      # style + erb_lint, with the repo-local configs pinned in the wrapper.
      # -f github annotates the PR with findings.
      - name: "Lint (single entry point: rubocop + erb_lint)"
        run: bin/lint -f github

      - name: Lint Gherkin feature files (when any exist)
        run: |
          if compgen -G "gherkin_specs/**/*.feature" > /dev/null; then
            bundle exec gherkin_lint $(ls gherkin_specs/**/*.feature)
          fi

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # The JobPollerWorker (and other Sidekiq specs) connect to Redis at the
      # default redis://localhost:6379/1; the mapped port satisfies that.
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build assets (tailwind)
        # View specs render stylesheet_link_tag "tailwind"; the built CSS lives in
        # app/assets/builds, which is gitignored, so a fresh checkout has none.
        run: RAILS_ENV=test bin/rails tailwindcss:build

      - name: Run the real suite (rspec)
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # REDIS_URL: redis://localhost:6379/0
          AGENT_TEST: "1"
        run: |
          bin/rails db:test:prepare
          set -o pipefail
          bin/rspec 2>rspec.stderr | tee rspec.stdout
          # PRD 0003 finding 4: this step replaces the Minitest step that executed
          # 0 examples (test/ holds no *_test.rb files) and reported green. rspec
          # also exits 0 on a zero-example run, so the verdict is checked, not
          # just the exit code — a lane that executes nothing must never pass.
          if ! grep -q '^TESTS OK' rspec.stdout; then
            echo "::error::Test lane verdict was not 'TESTS OK' (zero examples or unknown run) — see rspec.stdout and the full log path on stderr"
            exit 1
          fi

      - name: Upload full test report
        # The agent signal is a lens over a full report written to disk; on a
        # failed run the runner is ephemeral, so keep the report + captured
        # lanes as an artifact for post-mortem.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rspec-report
          path: |
            tmp/agent-test/rspec-full.log
            tmp/agent-test/app-output.log
            rspec.stdout
            rspec.stderr
          if-no-files-found: ignore

      - name: Agent test signal contract
        run: bin/test-agent-signal

      - name: Cucumber (only when features exist)
        if: ${{ hashFiles('gherkin_specs/**/*.feature') != '' }}
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bundle exec cucumber

  verify:
    # The Tier-0 gate (PRD 0003; membership per PRD 0006 F3): bin/verify
    # composes bin/lint -> bin/brakeman --no-pager -> bundler-audit ->
    # bin/packwerk check -> parity -> bin/rspec and stops at the first
    # failure. A green "done" claim requires this job to pass; it is
    # fail-closed (a gate that cannot run is a failure, never a pass).
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build assets (tailwind)
        run: RAILS_ENV=test bin/rails tailwindcss:build

      - name: Run bin/verify (Tier-0 gate)
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: |
          bin/rails db:test:prepare
          bin/verify
