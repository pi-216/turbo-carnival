# Package for pipeline domain logic
#
# This pack encapsulates the core data models and business logic for
# AI image generation pipelines, including Pipeline, PipelineStep, and ImageCandidate.

enforce_dependencies: true
dependencies:
  - "."
  # The pipeline orchestrates the daily flow: it resolves content_pillars
  # (Photo/ContentPillar/LinkWinnerToPillar) and personas (Persona) for each
  # run. References from pipeline into content_strategy (StrategyState),
  # job_orchestration (JobOrchestrationConfig), scheduling (Scheduling::Post)
  # and comfyui (ComfyuiJob) are baselined in package_todo.yml: comfyui and
  # job_orchestration already declare pipeline, and content_strategy and
  # scheduling are connected to pipeline via clustering, so declaring the
  # direct edges would close cycles in the dependency graph.
  - packs/content_pillars
  - packs/personas
metadata:
  owner: Platform Team
