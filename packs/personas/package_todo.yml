# This file contains a list of dependencies that are not part of the long term plan for the
# 'packs/personas' package.
# We should generally work to reduce this list over time.
#
# You can regenerate this file using the following command:
#
# bin/packwerk update-todo
#
# The per-entry justifications below are YAML comments: regenerating this file
# removes them. The reasoning also lives in the issue #46 PR description.
---
# A persona has content pillars and pillar photos (has_many through
# :content_pillars, class_name: 'ContentPillars::Photo'). content_pillars
# already declares personas, so the reverse edge would close a 2-cycle.
packs/content_pillars:
  "::ContentPillar":
    violations:
    - dependency
    files:
    - packs/personas/app/models/persona.rb
  "::ContentPillars::Photo":
    violations:
    - dependency
    files:
    - packs/personas/app/models/persona.rb
